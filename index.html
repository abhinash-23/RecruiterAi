<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Without an href the browser falls back to /favicon.ico, which 404s on
         every page load. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecruiterAI</title>

    <!-- The boot loader. Everything the app draws waits for its JavaScript, a
         single bundle of over a megabyte, and until then this page was an empty
         white document — white even in dark mode, because the theme is applied
         by React. So the loader is plain HTML and inline CSS that paints on the
         first frame, and React replaces it when it renders into #root.

         The theme is resolved here, before the body exists, from the same
         `theme` key and the same rules as `theme-provider.tsx`. The landing page
         is light-only, so it always gets the light loader: a dark one would
         flash before a white page. -->
    <script>
      ;(function () {
        var dark = false
        try {
          var theme = localStorage.getItem("theme")
          dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
        } catch (e) {
          // Storage blocked: fall back to light, as the provider does.
        }
        // An invitation's `/#/otp?…` link is root too, but it is the
        // candidate's page, not the landing page.
        if (
          /^\/*$/.test(window.location.pathname) &&
          !/^#\//.test(window.location.hash)
        ) {
          dark = false
        }
        document.documentElement.setAttribute(
          "data-boot-theme",
          dark ? "dark" : "light"
        )
      })()
    </script>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #737373;
        font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: light;
      }
      #boot-loader .boot-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #e5e5e5;
        border-top-color: #0052ff;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-loader .boot-name {
        color: #0a0a0a;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      [data-boot-theme="dark"] #boot-loader {
        background: #0a0a0a;
        color: #a1a1a1;
        color-scheme: dark;
      }
      [data-boot-theme="dark"] #boot-loader .boot-spinner {
        border-color: #262626;
        /* The console's dark --accent-brand; the hex is for browsers without
           oklch. */
        border-top-color: #6b9bff;
        border-top-color: oklch(0.76 0.145 258);
      }
      [data-boot-theme="dark"] #boot-loader .boot-name {
        color: #fafafa;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <div class="boot-name">RecruiterAI</div>
        <div>Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
