# =============================================================================
# Everything the `/api` locations share, except `proxy_pass` and the timeouts.
# =============================================================================
# There are two of those locations — one for the WebSocket routes and one for
# ordinary calls — and they differ *only* in how long they wait. Keeping the rest
# here means a header added for one can't quietly be missing from the other.
#
# **No `${...}` in this file, deliberately.** `envsubst` runs over
# /etc/nginx/templates/*.template and nothing else, so a variable written here
# would reach nginx as the literal text `${API_PROXY_TARGET}` — which is how a
# previous version of this image failed to boot at all. The two values that need
# substituting (`resolver` and `$api_upstream`) therefore live in the template,
# at `server` level, where both locations inherit them.
# =============================================================================

# What `changeOrigin: true` does in the dev proxy: present the target's own
# hostname. A tunnel or a vhost routes on Host, and forwarding this server's name
# would reach the wrong backend — or nothing.
proxy_set_header Host              $proxy_host;
proxy_ssl_server_name on;

proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# The client's protocol, not this server's — see the `$client_proto` map.
proxy_set_header X-Forwarded-Proto $client_proto;

# Free ngrok tunnels answer anything browser-shaped with an HTML warning page.
# This asks for the real response, exactly as the dev proxy does.
proxy_set_header ngrok-skip-browser-warning "true";

# The upgrade handshake. Without these nginx answers it as an ordinary request
# and no socket ever opens — neither live viewing nor the candidate's recording.
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Résumé PDFs and base64 profile pictures go up through here. A picture is sent
# as a data URL inside JSON, so its base64 is a third larger than the file.
client_max_body_size 25m;

# A socket that is held open for half an hour must not be held back waiting for a
# buffer to fill, and neither should a streamed response.
proxy_buffering off;
