# =============================================================================
# Response headers sent on everything this server returns.
# =============================================================================
# In a file because of an nginx rule that catches people out: `add_header` is
# inherited from the enclosing block **only while the current block declares
# none of its own**. The moment a `location` sets one — a cache policy, say —
# it silently drops every header from above it. So each location that sets a
# header of its own has to `include` this back.
# =============================================================================

# Stop the browser guessing a type we didn't send. Directly relevant here: the
# PDF.js worker is a module script, and a module served as the wrong type is
# refused outright — this makes that refusal deterministic rather than dependent
# on sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Nothing in this app is meant to be framed, and a hiring console that can be is
# a clickjacking target — an invisible frame over "Disable HR user" is a click
# the operator never knowingly made.
add_header X-Frame-Options "SAMEORIGIN" always;

# Interview URLs carry an interview id and the candidate's email in the query
# string. Without this the whole URL travels in the `Referer` of any outbound
# request the page makes.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# **Camera and microphone are deliberately allowed.** The sitting cannot run
# without them, and a Permissions-Policy that omits a feature *denies* it — so
# this list has to name them, not merely leave them out. Everything the app
# never asks for is switched off.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;
